const E=DATA.entries, NOTES=DATA.notes||{}, LABELS=DATA.labels||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>{if(LABELS[d])return LABELS[d];const [y,m,g]=d.split("-");return `${+g} ${MESI[+m-1]} ${y}`};
const allDays=[...new Set(E.map(e=>e.date).concat(Object.keys(NOTES)))].sort();
const latest=[...new Set(E.map(e=>e.date))].sort().pop();
const years=[...new Set(allDays.map(d=>d.slice(0,4)))].sort().reverse();
const isProf=e=>/^(matte|matteo d\.)$/i.test(e.name)||(/^matteo$/i.test(e.name)&&e.year==="2021");

$("#facts").innerHTML=`<span><b>${years.length}</b> stagioni</span><span><b>${allDays.length}</b> giornate</span><span><b>${E.length}</b> pagelle</span><span>Voto del professore: <b>sempre 10</b></span>`;

let tab="novita";
try{const h=location.hash.slice(1);if(h==="novita"||h==="stats"||h==="people"||(/^y\d{4}$/.test(h)&&years.includes(h.slice(1))))tab=h}catch(e){}

function hl(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function band(v){return v===null||v===undefined?"":v<6?"v-ko":v<8?"v-mid":"v-ok"}
function card(e,q,showDate){
  const ph=e.photo?`<button type="button" class="ph" data-src="foto/${e.photo}" data-cap="${esc(e.name)} · ${esc(e.voto)}" aria-label="Foto di ${esc(e.name)}"><img loading="lazy" src="foto/${e.photo}" alt="${esc(e.name)}"></button>`:`<div class="noph" aria-hidden="true">${esc(e.name.slice(0,1))}</div>`;
  return `<article class="card${isProf(e)?" prof":""}${e.photo?"":" textonly"}">${ph}<div class="body">
    <div class="who"><h4>${showDate?`<span class="tag">${fmt(e.date)}</span><br>`:""}<button type="button" class="pl" data-p="${esc(canon(e))}">${hl(e.name,q)}</button></h4><div class="voto${e.voto.length>7?" long":""} ${band(votoNum(e.voto,e))}">${esc(e.voto)}</div></div>
    <p class="text">${hl(e.text,q)}</p>
    ${e.title?`<div class="stamp">${hl(e.title,q)}</div>`:""}
  </div></article>`;
}
function daySection(d,items,q,showTitle=true){
  let h=`<section class="day" id="d${d}">`;
  if(showTitle) h+=`<h3>${fmt(d)} ${items.length?`<small>${items.length} pagelle</small>`:""}</h3>`;
  if(NOTES[d]&&!q) h+=`<p class="note">${esc(NOTES[d])}</p>`;
  if(items.length) h+=`<div class="grid">${items.map(e=>card(e,q)).join("")}</div>`;
  return h+`</section>`;
}

function canon(e){
  if(e.person) return e.person;
  for(const r of (DATA.alias_rules||[])) if(r.name===e.name&&(!r.year||r.year===e.year)) return r.to;
  return (DATA.aliases||{})[e.name]||e.name;
}
function renderStats(){
  const pres={}, allp={};
  for(const e of E){ const n=canon(e); (allp[n]=allp[n]||[]).push(e); if((DATA.no_presence||[]).includes(e.name)) continue; (pres[n]=pres[n]||new Set()).add(e.date); }
  const ys=[...years].sort();
  const rows=Object.entries(pres).map(([n,s])=>({n,tot:s.size,by:Object.fromEntries(ys.map(y=>[y,[...s].filter(d=>d.startsWith(y)).length])),avg:media(allp[n]||[]),cnt:(allp[n]||[]).length})).sort((a,b)=>b.tot-a.tot||a.n.localeCompare(b.n));
  const maxT=rows[0].tot, days=new Set(E.map(e=>e.date)).size;
  const top=rows.filter(r=>r.tot===maxT).map(r=>r.n).join(" e ");
  const cur=years[0], nuovi=rows.filter(r=>r.by[cur]>0&&r.tot===r.by[cur]).map(r=>r.n);
  const elig=rows.filter(r=>r.tot>=3&&r.avg!==null);
  const best=[...elig].sort((a,b)=>b.avg-a.avg)[0], worst=[...elig].sort((a,b)=>a.avg-b.avg)[0];
  const f1=v=>v===null?"–":v.toFixed(1).replace(".",",");
  let h=`<div class="season-head"><h2>Statistiche</h2><span>Le presenze dal 2021 a oggi</span></div>`;
  h+=`<div class="tiles"><div class="tile"><b>${days}</b><span>giornate con pagelle</span></div><div class="tile"><b>${rows.length}</b><span>partecipanti diversi</span></div><div class="tile"><b class="pen">${maxT}</b><span>presenze record: ${esc(top)}</span></div><div class="tile"><b>${nuovi.length}</b><span>debuttanti ${cur}${nuovi.length?": "+esc(nuovi.join(", ")):""}</span></div>${best?`<div class="tile"><b>${f1(best.avg)}</b><span>media più alta: ${esc(best.n)}</span></div>`:""}${worst?`<div class="tile"><b>${f1(worst.avg)}</b><span>fanalino di coda: ${esc(worst.n)}</span></div>`:""}</div>`;
  let vis=statAll?rows:rows.filter(r=>r.tot>=3);
  const dir=statDir;
  vis=[...vis].sort((a,b)=>{let x,y;if(statSort==="avg"){x=a.avg??-1;y=b.avg??-1}else if(statSort==="n"){return dir*a.n.localeCompare(b.n)}else{x=a.tot;y=b.tot}return dir*(y-x)||a.n.localeCompare(b.n)});
  const arr=k=>statSort===k?(dir===1?" ▼":" ▲"):"";
  h+=`<div class="statbar"><span>Ordina toccando le intestazioni della tabella.</span><label class="chk"><input type="checkbox" id="statall" ${statAll?"checked":""}> Mostra anche chi ha meno di 3 presenze</label></div>`;
  h+=`<div class="tablewrap"><table class="pres"><thead><tr><th class="n"><button type="button" class="sort" data-sort="n">Nome${arr("n")}</button></th>${ys.map(y=>`<th>${y}</th>`).join("")}<th class="n"><button type="button" class="sort" data-sort="tot">Presenze${arr("tot")}</button></th><th><button type="button" class="sort" data-sort="avg">Media${arr("avg")}</button></th></tr></thead><tbody>`;
  for(const r of vis){
    h+=`<tr${r.n==="Matte"?' class="prof"':""}><td class="n">${esc(r.n)}</td>${ys.map(y=>`<td${r.by[y]?"":' class="z"'}>${r.by[y]||"·"}</td>`).join("")}<td class="tot"><span class="bar" style="width:${Math.round(90*r.tot/maxT)}px"></span>${r.tot}</td><td class="${band(r.avg)}">${f1(r.avg)}</td></tr>`;
  }
  h+=`</tbody></table></div><p class="statnote">${statAll?"":`Sono nascosti ${rows.length-vis.length} partecipanti con meno di 3 presenze. `}Una presenza è una giornata con la pagella; i weekend raccontati in un unico Pagellino contano come una giornata. Nel 2022 e nel 2023 i Pagellini coprono solo due giornate per stagione. Media: + e − valgono un quarto di voto, i voti oltre il 10 contano per intero (10+3+3 vale 16), i voti in trentesimi sono riportati in decimi. Media più alta e fanalino di coda considerano chi ha almeno 3 presenze.</p>`;
  return h;
}



function votoNum(v,e){
  v=String(v).toLowerCase().replace(",",".").trim();
  if(/in due/.test(v)) return null;
  const m=v.match(/^(\d+(?:\.\d+)?)/); if(!m) return null;
  let n=parseFloat(m[1]);
  if(n>10&&n<=30&&e&&/30esimi/i.test(e.text)) n=n/3;
  let rest=v.slice(m[1].length);
  const add=rest.match(/\+\s*\d+/g); if(add) add.forEach(a=>n+=parseFloat(a.replace(/[^\d]/g,"")));
  rest=rest.replace(/[+-]\s*\d+/g,"");
  n+=(rest.match(/\+/g)||[]).length*0.25-(rest.match(/-/g)||[]).length*0.25;
  return Math.max(0,n);
}
function media(list){const a=list.map(e=>votoNum(e.voto,e)).filter(v=>v!==null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}

let personSel=null, statSort="tot", statDir=1, statAll=false;
function peopleIndex(){
  const m={};
  for(const e of E){const n=canon(e);(m[n]=m[n]||[]).push(e)}
  return m;
}
function renderPeople(){
  const m=peopleIndex();
  if(personSel&&m[personSel]){
    const list=[...m[personSel]].sort((a,b)=>b.date.localeCompare(a.date));
    const days=new Set(list.filter(e=>!(DATA.no_presence||[]).includes(e.name)).map(e=>e.date)).size;
    const mm=media(list); const avg=mm===null?"–":mm.toFixed(1).replace(".",",");
    let h=`<button type="button" class="back" data-back="1">← Tutti i partecipanti</button>`;
    h+=`<div class="season-head"><h2>${esc(personSel)}</h2><span>${days} presenze · ${list.length} pagelle · voto medio ${avg}</span></div>`;
    const ys=[...new Set(list.map(e=>e.year))];
    for(const y of ys){h+=`<section class="day"><h3>${y} <small>${list.filter(e=>e.year===y).length} pagelle</small></h3><div class="grid">${list.filter(e=>e.year===y).map(e=>card(e,"",true)).join("")}</div></section>`}
    return h;
  }
  const rows=Object.entries(m).map(([n,l])=>({n,l,c:l.length,ph:[...l].sort((a,b)=>b.date.localeCompare(a.date)).find(e=>e.photo)})).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n));
  let h=`<div class="season-head"><h2>Partecipanti</h2><span>${rows.length} persone · tocca un nome per vedere tutte le sue pagelle</span></div><div class="people">`;
  for(const r of rows) h+=`<button type="button" class="person" data-p="${esc(r.n)}"><span class="av" ${r.ph?`style="background-image:url('foto/${r.ph.photo}')"`:""}>${r.ph?"":esc(r.n.slice(0,1))}</span><span class="pn">${esc(r.n)}<span class="pc">${r.c} ${r.c===1?"pagella":"pagelle"}</span></span></button>`;
  return h+`</div>`;
}
function openPerson(n){tab="people";personSel=n;$("#q").value="";try{history.replaceState(null,"","#people")}catch(e){}render();window.scrollTo({top:$(".tabs").offsetTop})}

function renderTabs(){
  const q=$("#q").value.trim();
  $("#tabs").innerHTML=`<button type="button" role="tab" class="new" data-t="novita" aria-selected="${!q&&tab==="novita"}">Novità</button>`+
    years.map(y=>`<button type="button" role="tab" data-t="y${y}" aria-selected="${!q&&tab==="y"+y}">${y}</button>`).join("")+`<button type="button" role="tab" class="stat" data-t="people" aria-selected="${!q&&tab==="people"}">Partecipanti</button>`+`<button type="button" role="tab" class="stat" data-t="stats" aria-selected="${!q&&tab==="stats"}">Statistiche</button>`;
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  renderTabs();
  let h="";
  if(q){
    const list=E.filter(e=>(e.name+" "+e.title+" "+e.text).toLowerCase().includes(q));
    h+=`<div class="season-head"><h2>Risultati</h2><span>${list.length} pagelle per “${esc(q)}”</span></div>`;
    if(!list.length) h+=`<p class="empty">Nessuna pagella trovata. Prova con un altro nome o soprannome.</p>`;
    for(const d of [...new Set(list.map(e=>e.date))].sort().reverse()) h+=daySection(d,list.filter(e=>e.date===d),q);
  } else if(tab==="people"){
    h+=renderPeople();
  } else if(tab==="stats"){
    h+=renderStats();
  } else if(tab==="novita"){
    const items=E.filter(e=>e.date===latest);
    h+=`<div class="season-head"><span class="badge">Nuovo</span><h2>${fmt(latest)}</h2><span>${items.length} pagelle fresche di frantoio</span></div>`;
    h+=daySection(latest,items,"",false);
  } else {
    const y=tab.slice(1), ds=allDays.filter(d=>d.startsWith(y)).reverse();
    const n=E.filter(e=>e.year===y).length;
    h+=`<div class="season-head"><h2>Stagione ${y}</h2><span>${ds.length} ${ds.length===1?"giornata":"giornate"} · ${n} pagelle</span></div>`;
    if(ds.length>1) h+=`<nav class="daychips" aria-label="Giornate ${y}">${ds.map(d=>`<a href="#d${d}" data-jump="d${d}">${fmt(d).replace(" "+y,"")}</a>`).join("")}</nav>`;
    for(const d of ds) h+=daySection(d,E.filter(e=>e.date===d),"");
  }
  $("#out").innerHTML=h;
}
$("#tabs").addEventListener("click",ev=>{const b=ev.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;personSel=null;$("#q").value="";try{history.replaceState(null,"","#"+tab)}catch(e){}render();
  const top=$(".tabs").offsetTop;if(window.scrollY>top)window.scrollTo({top});b.scrollIntoView({block:"nearest",inline:"center"})});
$("#out").addEventListener("click",ev=>{const a=ev.target.closest("a[data-jump]");if(!a)return;ev.preventDefault();const el=document.getElementById(a.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth"})});
$("#q").addEventListener("input",render);
document.addEventListener("change",ev=>{if(ev.target.id==="statall"){statAll=ev.target.checked;render()}});
document.addEventListener("click",ev=>{const s=ev.target.closest("[data-sort]");if(s){const k=s.dataset.sort;if(statSort===k)statDir=-statDir;else{statSort=k;statDir=k==="n"?1:1}render();return}const p=ev.target.closest("[data-p]");if(p){openPerson(p.dataset.p);return}const bk=ev.target.closest("[data-back]");if(bk){personSel=null;render();window.scrollTo({top:$(".tabs").offsetTop})}});
const lb=$("#lb");
document.addEventListener("click",ev=>{const b=ev.target.closest(".ph");if(!b)return;$("#lbimg").src=b.dataset.src;$("#lbimg").alt=b.dataset.cap;$("#lbcap").textContent=b.dataset.cap;lb.showModal()});
$("#lbx").addEventListener("click",()=>lb.close());
lb.addEventListener("click",ev=>{if(ev.target===lb)lb.close()});
render();
</script>

</body>
</html>
