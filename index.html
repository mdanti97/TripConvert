: "2023"}, {"date": "2023-11-18", "name": "Nonna", "voto": "7.5", "text": "Sempre presente, vede olive anche dove non ci sono. Dispensa consigli con le braccia dietro la schiena e assume il ruolo di anziano saggio. Elevato comunque il contributo alla raccolta.", "title": "MAESTRO SHIFU", "photo": null, "year": "2023"}, {"date": "2023-11-18", "name": "Matte", "voto": "9 +1", "text": "Oggi indiscutibile la sua prestazione. Lo dimostra anche il ritardo nella pubblicazione delle pagelle. Teli, frullino, goldoni. Non gli è mancato nulla. Per sfizio fa un salto nel bosco e trova anche un porcino.", "title": "ESEMPLARE UNICO", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Baio", "voto": "6", "text": "Qualcuno dice sia passato a lavorare la mattina. Ma le indagini sono ancora in corso. Voto 6 politico.", "title": "SULLA FIDUCIA", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Nicola", "voto": "7-", "text": "Oggi più presente di ieri e migliora la prestazione, ma olive colte abbastanza poche. Ha potato mezzo ferrano. Ogni tanto tira fuori qualche idea di merda.", "title": "LEADER SHEEP", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Checco", "voto": "7.5", "text": "Oggi prestazione di livello inferiore, ma comunque buona. Sente sulle spalle il peso della tenuta e delle parole del padre. Tutto questo un giorno sarà tuo.", "title": "SIMBA", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Madda", "voto": "6.5", "text": "Oggi ha fatto il suo. Un po’ troppe polemiche per il voto di ieri, anche se meritato. La mattina lavora bene, il pomeriggio si è persa e qualcuno la sta ancora cercando.", "title": "NEMO", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Silvi", "voto": "7", "text": "Gli è tornato il sorriso nel momento in cui andavano ripiegati i teli, anche se troppe grinze per i suoi standard. Una leggenda narra che abbia anche colto qualche oliva.", "title": "CONTROLLO QUALITÀ", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Rani", "voto": "7.5", "text": "La mattina ha dato il meglio di se. Insieme al compagno Michelini hanno frullato anche la nonna Lucia. Ogni tanto prova a intonare qualche canzone, ma il freddo congela i compagni che rimangono in silenzio. Ama pisciare nel bosco.", "title": "DOPO 3 SGRULLATE È SEGA!", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Virgi", "voto": "7-", "text": "Nella raccolta fa il suo dovere, rischia il burrone un paio di volte e non chiude mai la bocca. Di compagnia. Vede ogni aiuto come offesa e sessismo. Ripigliati.", "title": "DISPENSER DI CAZZATE", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Miche", "voto": "8 +", "text": "La prestazione è ai suoi livelli. Mantiene la media degli scorsi anni e si qualifica nella top 3 delle raccolte. Fa gruppo e risultato. Un unico difetto, è vegetariano. Ma a sua discolpa, non perché ama gli animali, ma perché odia le piante.", "title": "TEAM BUILDER", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Nicole", "voto": "5.5", "text": "Arriva, saluta tutti con la solita gentilezza è mai più vista. Qualcuno sa che fine ha fatto?", "title": "COMPARSA", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Lia", "voto": "7", "text": "Ecco la Neo mamma, Oltre a coccolare un mucchio di coperte, arriva precisa per rifocillarsi. Delega il più possibile la gestione della piccola creatura ma non si rifiuta mai nel dargli da poppare.", "title": "ALL YOU CAN DRINK", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Leo", "voto": "4.5", "text": "Tanti i tentativi di non ricevere un “senza voto”. Fa un po’ il leccaculo con il prof , ma a volte non basta. L’unico sforzo quello di arrivare a Masino, ma il lavoro era già stato fatto.", "title": "A SETTEMBRE CON 3 MATERIE", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Andrea", "voto": "5.5", "text": "Arriva anche lui per pranzo, e direi anche puntuale. Un bella corsa per andare e tornare dal sud in due giorni, ma si sa, le bombette così buone alla Coop di diacceto non ci sono.", "title": "DALLA PUGLIA CON SUDORE", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Lucia", "voto": "6.5", "text": "Oggi un po’ sottotono. Difficili da comprendere alcuni discorsi e alcuni riferimenti. Parla molto, ma spesso non con te.", "title": "PARLANDO CON LE STELLE", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Ada", "voto": "10", "text": "Ha capito che basta piangere per ottenere ciò di cui ha bisogno. Amore incondizionato e cibo. Certo che ci cascano sempre tutti. SCROCCONA Passo: S.V Una volta disse “arrivo dopo pranzo!”. Chissà dove si trova e che fuso orario c’è.", "title": "NON PERVENUTO", "photo": null, "year": "2023"}, {"date": "2023-11-19", "name": "Matte", "voto": "10-+", "text": "Arriva un po’ ritardo, ma perdonato da tutti subito. Apparecchia Masino in maniera super efficace. Pregiato il suo contributo.", "title": "RISERVA 97", "photo": null, "year": "2023"}, {"date": "2024-11-01", "name": "Nicole", "voto": "8-", "text": "Prima ancora di salutare il suo amato nipote gli ha detto \"io è da stamattina che lavoro e andrea mi ha detto che è inutile!\". Nonostante ciò, anche se con le scarpe sbagliate completa le sue attività e con ottimi risultati. Nelle foto comunque affascinante.", "title": "FERITA NELL'ORGOGLIO", "photo": "00003361-PHOTO-2024-11-01-17-25-23.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Andrea", "voto": "5-", "text": "Oggi non pervenuto sul campo. Dicono che abbia lavorato moltissimo il primo giorno e quindi gli lasciamo il beneficio del dubbio e un voto non tremendo. Tuttavia oggi poco professionale e assente.", "title": "SGAMBETTO A SORPRESA", "photo": "00003362-PHOTO-2024-11-01-17-25-46.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Sylvie", "voto": "8.5", "text": "Direttamente dalla Francia è arrivato il nuovo acquisto. Si aspettava più vino e più chiacchiere con la Nicole ma si vede che la sua amica l'ha istruita bene. \"A ferrano zitti, e lavorare, almeno se vuoi avere il 6 in pagella\". Prova superata e con eccellenza. Era l'energia che ci mancava. Brava Sylvie!", "title": "POWER BANK", "photo": "00003363-PHOTO-2024-11-01-17-26-16.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Didier", "voto": "7.5", "text": "Prima raccolta in quel di ferrano, ma già 2 presenze su 2. Scruta attentamente ogni mossa dei compagni e ogni elemento del panorama. Sylvie un po' gelosa della sua macchina fotografica. Ma le sue foto sicuramente sono le migliori, lo rivogliamo in campo per il prossimo anno, il reportage è assicurato.", "title": "ASSUNTO", "photo": "00003364-PHOTO-2024-11-01-17-26-44.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Nicola", "voto": "8", "text": "Come sempre il capo brigata. Si impegna soprattutto nei primi giorni dove gli aiutanti sono pochi o nulli e macina quintali su quintali. Sta aspettando gli aiuti del fine settimana per potersi rilassare e godersi un po' di più la raccolta. È l'unico che ne sa qualcosa, ma troppo serioso. #Divertiamoci", "title": "REINVENTATO L'HOBBYSTA", "photo": "00003365-PHOTO-2024-11-01-17-27-05.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Madda", "voto": "8+", "text": "Arrivare e vedere la sua macchina parcheggiata ci ha fatto spaventare e pensare che fosse guasta. Invece ci ha stupiti tutti, era nel campo e lavorava. Sarà che con la nuova residenza ha capito che la scelta era solo una, lavorare o 15€ al litro.", "title": "LA PRIMA VOLTA NON SI SCORDA", "photo": "00003366-PHOTO-2024-11-01-17-28-04.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Leonard", "voto": "8-", "text": "Appena arrivato sul campo era insieme alle cuoche davanti casa e non partiva bene. Ma anche se con due ore di sonno, frullino in mano e lavorare, ha recuperato, e molto bene. Oggi non ci è cascato nella \"trappola\" Ada, non è stato il migliore della giornata ma comunque risultato preso. Va via prima delle pagelle, peccato poteva esultare davanti a tutti.", "title": "DUE, MA DI BRISCOLA", "photo": "00003367-PHOTO-2024-11-01-17-28-38.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Lia", "voto": "6", "text": "Oggi mamma full time. Non ha contribuito alla raccolta ma almeno ha evitato che Ada remasse contro mangiandole tutte. Ogni tanto arriva l'ora della merenda e del pisolo.", "title": "KINDER FETTA A LETTO", "photo": "00003368-PHOTO-2024-11-01-17-29-16.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Ada", "voto": "10", "text": "Seconda raccolta per lei, questa volta meno al riparo della scorsa. Finge di essere ancora ai primi passi, ma solo per scampare al frullino e ai piani di Nicola. Molto innocente a prima vista ma appena rimasta sola con il maestro gli ha detto in un orecchio \"s'il te plaît, donne-moi un 8 sur mon bulletin\", dimostrando di conoscere le regole del gioco. Riceve attenzioni da chiunque voglia riposarsi un attimo.", "title": "SPECCHIO PER LE ALLODOLE", "photo": "00003369-PHOTO-2024-11-01-17-29-43.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Charlotte", "voto": "7- -", "text": "Per la prima parte della giornata lavora e si dà da fare. Poi si dedica un po' di tempo per fare la zia. Ogni tanto scambia frullino con rastrello, poi torna da Ada a riposarsi.", "title": "ALLODOLA CHE AMA GLI SPECCHI", "photo": "00003370-PHOTO-2024-11-01-17-30-18.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Francesca", "voto": "7", "text": "Oggi ci ha deliziati con un ottimo pranzo gentilmente offerto. Ieri non è stata da meno. E nessuno vorrebbe mai smettere di mangiare. Contributo ottimo nella raccolta. Stavolta però non ha riempito le tasche. Gli eredi non sanno cosa si stanno perdendo, sono attesi sabato e domenica, e questo è un ultimatum.", "title": "PENULTIMA CENA", "photo": "00003371-PHOTO-2024-11-01-17-30-40.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Fabio", "voto": "6.5", "text": "La sua costanza è invidiabile e anche quest'anno si riconferma uno stakanovista. Gli è stato proibito di riprendere il suo amato frullino arancione, e per questo già dal primo giorno minaccia di mettersi in malattia. Contro ogni ordine però lo recupera e si dedica un momento di felicità, corto perché poi si rompe di nuovo. In generale un po' troppo polemico.", "title": "SCIOPERO IN VISTA", "photo": "00003372-PHOTO-2024-11-01-17-31-08.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Silvia", "voto": "7.5", "text": "Ottima giornata di raccolta per la nostra amata Madrigali. Olive su olive, anche se ne ha pestate un po' troppe. Anche se la causa è giusta se ne va prima delle pagelle.", "title": "PEPPINA IMPACCIATA", "photo": "00003373-PHOTO-2024-11-01-17-31-27.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Checco", "voto": "6-", "text": "Complice il mal di gola, il raffreddore e la poca voglia di andare a Dubai. La mattina sorveglia il frantoio e crea agganci con il boss procurando un contatto importante. Il pomeriggio si destreggia tra fare consulenza di impianti elettrici e conti su resa dell'olio ma mai costante e con il focus sulla raccolta.", "title": "SALEWA E SCENDEWA", "photo": "00003374-PHOTO-2024-11-01-17-31-45.jpg", "year": "2024"}, {"date": "2024-11-01", "name": "Lucia", "voto": "9-", "text": "Parte con il mal di pancia e l'agitazione, ma da capofamiglia non manca ai suoi doveri. Felice quando il nipote gli porta un olivo a piano terra. Tutta la tribù è in attesa dei suoi capolavori in cucina, dove, oltre al campo di olivi, esprime al meglio le sue melodie.", "title": "BET HOVEN", "photo": null, "year": "2024"}, {"date": "2024-11-01", "name": "Matte", "voto": "10", "text": "Nel contratto sono 2 i suoi compiti, fare il caffè (contratto in scadenza per passaggio a Dennis) e scrivere le pagelle. Nessuno ha mai parlato di raccogliere le olive, ma siccome è un gentiluomo aiuta pure su questo fronte. 10 non è il voto ma è il numero di maglia dato che si ritrova l'unico a lavorare. Arriva alle 12, la plebe crede che sia per festeggiare con gli amici, i compagni invece sanno che ha fatto tardi a preparare la strategia per il giorno dopo. Come sempre pagelle senza favoritismi.", "title": "UN GIORNO DA ZIO ANDREA", "photo": "00003376-PHOTO-2024-11-01-17-32-47.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Livia", "voto": "9.5", "text": "Difficile raggiungere questi risultati con una mano sola, in più alla sua prima raccolta si presenta anche con la schiacciata. Un braccio in meno non è un problema per lei, ma un'opportunità.", "title": "LA CARICA DEI 104", "photo": "00003381-PHOTO-2024-11-02-16-56-37.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Riccardo", "voto": "10", "text": "Difficile eguagliare una prima prestazione così. Il debutto sul campo degli olivi è andato meglio di quello degli amatori al Santa Brigida. Dribbla tutti gli olivi, li scavalca e li pettina uno ad uno. Il premio frullino d'oro è vicino.", "title": "BOMBER DI RAZZA", "photo": "00003382-PHOTO-2024-11-02-16-56-58.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Maddalena", "voto": "7+", "text": "Dopo la grande prestazione di ieri e consapevole della bottiglia di olio già guadagnata oggi arriva più serena e con calma. Olive colte probabilmente 0 ma sposta teli sfilando tra gli olivi e apparecchia tutto ferrano. Il più nel voto è perché aiuta a fare i caffè.", "title": "POCO CHANEL", "photo": "00003383-PHOTO-2024-11-02-16-57-20.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Spartaco", "voto": "7+", "text": "Come ogni anno ci degna della sua presenza e lavora più del figlio a cui impartisce un po' di lezioni. Ogni tanto urla \"vagabondo!\" a chi si siede. Secondo lui avremmo dovuto mangiare in piedi.", "title": "VECCHIA SCUOLA", "photo": "00003384-PHOTO-2024-11-02-16-57-56.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Gioia", "voto": "7.5", "text": "Del suo livello ce ne sono poche, e spesso stanno a dare mano in cucina. Lei si rifiuta, e non si ferma un attimo. Olive colte almeno il 5% del totale. Immortalata nell'unico attimo di riposo.", "title": "INASPETTATO", "photo": "00003385-PHOTO-2024-11-02-16-58-10.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Nicola", "voto": "6.5", "text": "Oggi più rilassato degli altri giorni. Sarà perché il figlio gli ha portato un po' di aiutanti. Si concede una giornata senza sforzi o pressioni, e guida la ciurma impartendo ordini. Trova nell'omonimo compagno un modo per distrarsi, ma tutto sommato oggi se lo può permettere.", "title": "INGEGNERE GESTIONALE", "photo": "00003386-PHOTO-2024-11-02-16-58-33.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Charlotte", "voto": "6-", "text": "Arriva alle 14.30 e per essere la sua seconda presenza in 4 anni ci aspettavamo di meglio. Il team punta molto sulle sue grandissime doti e sulle sue capacità ma viene, in parte, deluso. Speriamo che il prossimo anno riesca a essere più presente per recuperare.", "title": "ESPERTA IN ASSENZE STRATEGICHE", "photo": "00003387-PHOTO-2024-11-02-16-59-00.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Silvia", "voto": "6.5", "text": "Oggi portava con sé la sbronza del giorno prima, ogni mossa era una fatica tremenda. Menomale che almeno ci ha portato l'acqua.", "title": "COSTANTEMENTE IN RISERVA", "photo": "00003389-PHOTO-2024-11-02-16-59-43.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Checco", "voto": "5.5", "text": "Si presenta in ritardo, e evita i frullini, si nasconde tra le fronde ma nessuno ci casca. Solo il fratello lo convince a prendere in mano il frullino a olivo finito in cambio di un po' di merito. Raffreddato e pronto per partire.", "title": "IN DO DU BAI?!", "photo": "00003388-PHOTO-2024-11-02-16-59-27.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Monica", "voto": "8", "text": "Prima raccolta per lei e si fa subito valere. Pettina tutti gli olivi e porta con sé le 3 grazie. Canta e balla a ritmo di musica ma la grazia è l'unica cosa che le manca mentre cazzotta gli olivi che non possono scappare.", "title": "MIC TYSON", "photo": "00003390-PHOTO-2024-11-02-17-00-13.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Nicola (ospite)", "voto": "8+", "text": "Capofamiglia chiacchierone ma non si ferma un secondo e rincorre tutte le olive, tanto da rompere le scarpe. Elegante e formale anche in un campo di olivi, cerca di creare una startup con ogni persona che incontra, ma mantiene sempre un tono di potere assoluto.", "title": "COLONNELLO BERNARDINI", "photo": "00003391-PHOTO-2024-11-02-17-00-35.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Giulia", "voto": "7", "text": "Probabilmente la seconda laurea sarà in scienze agrarie. Sembra nata per questo lavoro, soprattutto perché appena fa buio si smette. Si muove chirurgicamente e cerca di staccare le olive senza toccare i rami.", "title": "PICCOLO CHIRURGO", "photo": "00003392-PHOTO-2024-11-02-17-00-53.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Lucia", "voto": "9", "text": "Sfido chiunque a trovare un difetto a questa lavoratrice. Se l'olio non sa di foglie è solo merito suo. Non puntiamo certo alla quantità, ma alla qualità delle sue azioni e dei prodotti che produce il podere.", "title": "SIMBOLO DI QUALITÀ", "photo": "00003394-PHOTO-2024-11-02-17-01-27.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Francesca", "voto": "8.5", "text": "Sappiamo tutti che il merito è il suo e non di quel cinghiale del Foggi. Ci sta abituando troppo bene a prestazioni di questo livello. La sua macelleria di fiducia ha sorpreso tutti. Come vederla con il frullino.", "title": "FABBRINI SPOSTATI", "photo": "00003395-PHOTO-2024-11-02-17-01-45.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Fabio", "voto": "6.5", "text": "Oggi giorno di ferie per il frullinista. Ha provato un po' di volte a rianimare il suo amato attrezzo arancione ma senza successo. Il progresso non fa parte del suo essere. Contributo comunque sufficiente.", "title": "PROGRAMMATO PER L'OBSOLESCENZA", "photo": "00003396-PHOTO-2024-11-02-17-02-18.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Chiara", "voto": "24", "text": "Oggi contribuisce notevolmente a sfoltire le radici degli alberi. Vista la vicinanza alla laurea il voto va espresso in 30esimi altrimenti abbassa troppo la media. Complice di troppe chiacchiere.", "title": "GOSSIP GIRL", "photo": "00003397-PHOTO-2024-11-02-17-02-37.jpg", "year": "2024"}, {"date": "2024-11-02", "name": "Andrea", "voto": "3", "text": "Pagella aggiunta in seguito, quando qualcuno lo ha avvistato alle 17 per la prima volta. Oggi giornata dal vivaio per lui.", "title": "TORNO SUBITO", "photo": null, "year": "2024"}, {"date": "2024-11-02", "name": "Matte", "voto": "10", "text": "Oggi doveva fare bella figura con i suoi ospiti. Frullino, teli, trattore. Oggi si è proprio preso in spalla tutti. Peccato per la scarsa performance da alpinista, voleva fare come i gatti ma è atterrato di schiena. Ha imitato il gatto sbagliato. Come sempre pagelle senza favoritismi.", "title": "GARFIELD", "photo": "00003398-PHOTO-2024-11-02-17-03-15.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Matteo", "voto": "5-", "text": "L'insufficienza sarebbe stata un colpo troppo duro e non meritato dato che per tutto il pomeriggio non ha mai spento il frullino. Ma a noi non ci interessa e quindi 5-. L'arrivo in ritardo lo penalizza ma sappiamo che probabilmente è colpa di Marj. Il 6 pieno può sognarselo essendo un gobbo di merda, a meno di non corrompere il maestro.", "title": "BRUCOPOLI", "photo": "00003410-PHOTO-2024-11-03-16-31-20.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Marjana", "voto": "4", "text": "Insufficiente grave per la piccola di casa Barchielli. Arriva in ritardo e fa pure arrabbiare la cuoca, ha vinto così una crociera andata e ritorno in ottima compagnia al frantoio.", "title": "TURISTA PER SEMPRE", "photo": "00003411-PHOTO-2024-11-03-16-31-37.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Gioia", "voto": "7+", "text": "Anche oggi presenza di spessore. Continua l'album per Instagram. Porta allegria e finisce il suo lavoro. Gioia di nome e di fatto.", "title": "DAL CAST DI INSIDE OUT", "photo": "00003412-PHOTO-2024-11-03-16-32-15.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Spartaco", "voto": "7.5", "text": "Grande lavoratore e bevitore di vino. Sposta teli, rastrella e si unisce agli insulti verso il gobbo di turno senza mai fermarsi.", "title": "ABBONATO IN CURVA FIESOLE", "photo": "00003413-PHOTO-2024-11-03-16-32-41.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Madda", "voto": "7-", "text": "La mattina ci prova, il pomeriggio sfrutta la presenza di altri per riposarsi. Sicuramente si meritava di meno ma oggi le fanno regali tutti, il babbo che le dice \"menomale ci sei te\" e la nonna che per convincerla le dice \"Vieni qua te che sei più esperta di tutti\".", "title": "A NATALE SIAMO TUTTI PIÙ BUONI", "photo": "00003414-PHOTO-2024-11-03-16-33-07.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Nicola", "voto": "6.5", "text": "Oggi il fattore ha convinto tutti a venire dicendo \"2 ore si fa tutto\". Purtroppo si sa, quando le vedi cadere, ci prendi gusto, alla fine ha fatto finire il campo a tutti. Soddisfatto a fine giornata.", "title": "ABBUFFINO", "photo": "00003415-PHOTO-2024-11-03-16-33-24.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Francesca", "voto": "9", "text": "Tre le motivazioni di questo voto. Primo per l'eccellente pranzo e torta di mele. Secondo per il suo contributo alla raccolta dato da teli riempiti in autonomia e tasche piene. Terzo perché colma i buchi lasciati dai figli ritardatari o assenti.", "title": "FEMMINA ALFA", "photo": "00003416-PHOTO-2024-11-03-16-33-42.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Fabio", "voto": "9", "text": "Oggi è il primo giorno. Il primo giorno senza il suo amato frullino. Il voto serve per compensare la sua perdita. Non collabora ma è perdonato.", "title": "CHIUSO PER LUTTO", "photo": "00003417-PHOTO-2024-11-03-16-33-59.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Leonard", "voto": "5.5", "text": "Convinto di averle colte tutte lui fa un sorriso a 800 denti. Un po' di mano l'ha data ma non così di rilievo come crede. Il giorno precedente chiama il maestro per esprimere il suo disappunto sul voto della compagna. Chiamata NON apprezzata. Oggi buono il contributo e ottima la sua compagnia, ma le regole sono altre e non le fa lui. Tutti gli vogliono bene.", "title": "INGIUSTO", "photo": "00003418-PHOTO-2024-11-03-16-34-16.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Lia", "voto": "8.5", "text": "Si lamenta dal maestro per il voto del giorno precedente, ma ha capito come funziona il gioco. No favoritismi né meritocrazia. Tutti fanno finta di non tenerci al voto ma oggi ha abbandonato Ada ed è scesa sul campo.", "title": "BRAVA MA NON SI APPLICA", "photo": "00003419-PHOTO-2024-11-03-16-34-39.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Ada", "voto": "10", "text": "Oggi era più bella che mai. Peccato che l'abbiamo vista poco perché la zia l'ha portata a fare un giro. Occhi stanchi e con tanta voglia di dormire.", "title": "È DOMENICA PER TUTTI", "photo": "00003420-PHOTO-2024-11-03-16-35-05.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Charlotte", "voto": "9-", "text": "L'ho vista 3 volte oggi: una a pranzo, una sul campo dove ha mollato il frullino subito ad altri, e una al rientro dalla sua passeggiata. Prima del rientro a Londra un giro per l'amata campagna è concesso.", "title": "MERITATO? NO", "photo": "00003421-PHOTO-2024-11-03-16-35-23.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Lucia", "voto": "8", "text": "Anche lei, madre del fattore, oggi non si è accontentata. Fanculo all'efficienza! Finché lei vede un'oliva sull'albero tutti i frullini seguono i suoi ordini.", "title": "OCCHIO DI FALCO", "photo": "00003422-PHOTO-2024-11-03-16-35-46.jpg", "year": "2024"}, {"date": "2024-11-03", "name": "Andrea", "voto": "6", "text": "Oggi assente sul campo ma ha un compito diverso. Macina chilometri su chilometri spostando quintali su quintali e portandoli al frantoio. Pronto a metterci la faccia per prendere gli insulti dal frantoio. Menomale oggi aveva un apprendista con sé.", "title": "ALCHIMISTA DEL DISORDINE", "photo": null, "year": "2024"}, {"date": "2024-11-03", "name": "Sylvie E Didier", "voto": "4 in due", "text": "Oggi hanno scelto di tornare in Francia, assenti e non pervenuti. Vi vogliamo bene e vi aspettiamo per la prossima raccolta.", "title": "RENDETECI LA GIOCONDA", "photo": null, "year": "2024"}, {"date": "2024-11-03", "name": "Matte", "voto": "9 +1", "text": "Dopo la caduta di ieri da un albero alto 20 metri tutti pensavano che fosse morto. E invece eccolo comparire e con un bel porcino. Ha lavorato tutto il pomeriggio, nonostante il collo e la schiena a pezzi manda avanti il lavoro e conclude il campo. Pagelle senza favoritismi né meritocrazia.", "title": "DITTATURA DEMOCRATICA", "photo": "00003425-PHOTO-2024-11-03-16-37-34.jpg", "year": "2024"}, {"date": "2024-11-09", "name": "Madda", "voto": "5.5", "text": "Oggi meno presente della scorsa settimana. Si presenta in ritardo, inventa una scusa in merito al pane, ma siamo tutti di Diacceto e sappiamo che ha dormito fino a mezzogiorno. Si sente in colpa e prepara i caffè. Dà qualche ordine al padre sulla sistemazione dei teli e lui si limita ad obbedirle.", "title": "PRETENDENTE AL TRONO", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Nicola", "voto": "5.5", "text": "Oggi lo abbiamo sentito parlare molto, ma si sa, quando ci sono tanti ospiti il suo ruolo è quello di dare indicazioni. A portare avanti il lavoro ci pensano i figli anche se non tutti. Oggi giorno di riposo e di messa in prova per le nuove generazioni. Gira tutta ferrano a bordo dei suoi mezzi.", "title": "GLOBETRACTOR", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Lucia", "voto": "7-", "text": "Oggi non è scesa troppo sul campo. Rimane in cucina a sorvegliare l'arista e il sugo. Ogni tanto sente un trattore arrivare e si mostra alla porta di casa.", "title": "CANE DA GUARDIA", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Mariarita", "voto": "7+", "text": "Oggi grande rientro in campo! Aveva saltato le ultime 3 presenze per riposarsi in montagna. Olive colte non molte, prese in testa tantissime. Alcuni l'hanno sentita che cercava quelle GROSSE E NERE. Menomale siamo in un campo di olivi e non di fave!", "title": "CAVALLINO MATTO", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Nicole", "voto": "6-", "text": "Niente da dire, oggi non una delle sue migliori prestazioni. Olive colte non molte, amava stare più con il gatto sotto gli olivi. Porta con sé in ogni conversazione comunque il solito fascino francese.", "title": "DOLCE&GARBATA", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Andrea", "voto": "4+", "text": "Oggi non abbiamo neanche avuto il tempo di fargli una foto. Alcune voci dicono che sia rimasto a intagliare un po' di legno al box. Giornata di assenza totale per lui. Si presenta però a pranzo per giusto due saluti.", "title": "VISITOR", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Alessandro", "voto": "8.5", "text": "Niente male il suo debutto al podere Caciatta. 64 anni e non sentirli! Sposta cassette e contribuisce notevolmente alla raccolta. Tutina comoda e a cuoricini per lui. Torna a casa con il miglior risultato. Non deve neanche fare la spesa, miele e olio per lui.", "title": "COMODO 64", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Stefania", "voto": "8", "text": "Oggi primo ingresso sul campo per la più grande di casa Madrigali. Ottimo contributo nella raccolta. Ama i lavori di pulizia e decespuglia tutte le cassette. Ogni tanto recita a memoria qualche ricetta culinaria e tutti prendono appunti.", "title": "SPECK FRIDAY", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Monica", "voto": "7-", "text": "Oggi non era nei suoi piani ma alla fine decide di venire e sfruttare il pomeriggio di sole. Prova anche il frullino, si dimostra decisamente più portata del marito. Supporta la raccolta in tutti i modi e lo fa decisamente bene! Sempre a chiacchiera con la compagna di merende.", "title": "STELLA DEL BAYERN MONICA", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Nicola (ospite)", "voto": "7.5", "text": "Oggi il colonnello ha voluto provare nuove esperienze. Assaggia la fatica del frullino e rinuncia immediatamente. Si appassiona però al Grillo e corre come se fosse al GP di Imola. Ha guardato 2 o 3 case nei dintorni. Che abbia in mente di diventare il padrone della valle!?", "title": "ASCESA AL PODERE", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Silvia", "voto": "8+", "text": "Durante la raccolta dà un notevole contributo, ma non è lì che esprime il suo meglio. Ordina una degustazione di formaggi e se li gode tutti. I Danti apprezzano, questa è lei, la nostra campionessa.", "title": "LET IT BRIE", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Checco", "voto": "5+", "text": "Giornata intensa per il ragazzo classe 94. Sempre a giro tra i campi a fare public relation. Olivi iniziati con il frullino, poi ceduto al fratello. Teli appoggiati ma lasciati sistemare alla sorella. Oggi giornata di racconti sul suo viaggio fuori porta, e tra una sigaretta e l'altra ogni tanto ha anche lavorato.", "title": "WINSTON ABBIAMO UN PROBLEMA", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Raffo", "voto": "6-", "text": "Oggi giornata intensa per il ragazzo. Ha seguito un training alle 8 di mattina dal master ed effettivamente ha lavorato molto e bene. Tuttavia sufficienza piena non meritata essendo in 20 anni che ci conosce e questa la sua prima volta che dà una mano. Si nasconde dietro al \"non mi avevi invitato\". Sembra una brava persona ma picchia gli olivi con cattiveria. Un po' polemico, forse si sente in competizione con il master. Ha capito però come funziona e lo aspettiamo molto volentieri anche settimana prossima.", "title": "WINNIE THE PUGILE", "photo": null, "year": "2024"}, {"date": "2024-11-09", "name": "Matte", "voto": "10", "text": "Stremato dalla giornata di oggi. Non ha neanche avuto il tempo di fare pagelle per tempo. Oggi un po' di tutto per lui: rastrello, frullino, teli, cassette, carico e scarico, Goldoni, Grillo. Fatelo riposare!", "title": "PROSSIMO ALLE FERIE", "photo": null, "year": "2024"}, {"date": "2024-11-10", "name": "Checco", "voto": "8", "text": "Oggi pochi insufficienti. Altrimenti sarebbe stato il primo. Macina olivi su olivi, prima volta per lui. Ucciso da qualche proiettile nell'occhio. Benedice tutti i santi e torna a casa pronto per settimana prossima, magari porterà gli occhiali.", "title": "URBI ET TORNI ORBI", "photo": "00003505-PHOTO-2024-11-10-16-48-00.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Nicola", "voto": "6.5", "text": "Sufficienza meritata solo perché oggi non poteva permettersi di stare a guardare e quindi collabora con la squadra. Continua tuttavia a ribadire quanto le pagelle non siano importanti e che solo il suo giudizio conta. Minaccia il master dicendo che sarà lui un giorno a fare le pagelle! Per oggi spazio alla clemenza, ma è uno da tenere d'occhio.", "title": "PROSSIMO AL COLPO DI STATO", "photo": "00003502-PHOTO-2024-11-10-16-47-26.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Maddalena", "voto": "8.5", "text": "Oggi porta avanti il lavoro vista l'assenza di aiutanti. Notevole il suo contributo nella raccolta. Dopo questa settimana acquista notevole leadership nel gruppo quasi a scavalcare il padre. Peccato le lamentele continue a carattere ereditario.", "title": "MADDALAGNA", "photo": "00003504-PHOTO-2024-11-10-16-47-51.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Andrea", "voto": "7.5", "text": "Oggi il nostro comandante si presenta stranamente all'appello. Non dà supporto nella raccolta delle olive ma porta con sé il miglior mezzo della fiera agricola 2024... l'Espace. Carica quintali di cassette e saluta la squadra pronto a salpare per il frantoio.", "title": "SKIPPER", "photo": "00003501-PHOTO-2024-11-10-16-47-18.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Lucia", "voto": "7-", "text": "Oggi non era troppo presente durante la mattina ma recupera il pomeriggio. Niente la ferma, e chi prova ne busca, come ai vecchi tempi.", "title": "SPONSOR CATERPILLAR", "photo": "00003500-PHOTO-2024-11-10-16-47-07.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Nicole", "voto": "7-", "text": "Oggi tutti molto felici e in attesa di leggere le pagelle. Lei prima su tutti. Dà sicuramente un valore aggiunto ogni volta che parla. Ride continuamente e la sua allegria contagia la squadra. Ogni tanto il Team la vede confusa, così confusa da colpirsi da sola.", "title": "MANGI QUA O PORTI VIA? PORTO QUA", "photo": "00003503-PHOTO-2024-11-10-16-47-40.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Matte", "voto": "10 e lode", "text": "Oggi ha fatto più squat che olive. Ma anche di olive ne ha fatte a migliaia. La squadra lo riconosce come leader indiscusso. Il Pagellino è il nuovo verbo, la raccolta delle olive una nuova religione. E come sempre senza favoritismi.", "title": "NUOVO MESSIA", "photo": "00003507-PHOTO-2024-11-10-16-48-40.jpg", "year": "2024"}, {"date": "2024-11-10", "name": "Silvi", "voto": "6 +", "text": "Oggi lavori pensanti per lei. Siamo in pochi e non c’è modo di riposarsi. Cerca di farlo pulendo le cassette, togliendo i rametti e le foglie ma viene coinvolta continuamente nella stesura teli e talvolta anche nel frullino.", "title": "ROWENTA, PER CHI NON PUÒ MA TENTA", "photo": "00003506-PHOTO-2024-11-10-16-48-11.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Spartaco", "voto": "7-", "text": "La sua grinta è leggenda, e nonostante la scarsa leadership, per pareggiare le sue olive raccolte non basterebbero 300 persone. Contributo più che ottimo. L'importante è non farlo arrabbiare.", "title": "QUESTA! È! SPARTACO!", "photo": null, "year": "2024"}, {"date": "2024-11-16", "name": "Fabio", "voto": "5", "text": "Oggi si presenta in mattinata e scappa dopo un paio di ore. Contributo scarso nella raccolta. Eppure anche se per poco, avevamo riportato in vita il suo amato frullino. Ma lui non c'era. Sicuramente non ci crederà quando i compagni glielo diranno.", "title": "SAN TOMMASO", "photo": "00003589-PHOTO-2024-11-16-18-15-04.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Nicola", "voto": "6.5", "text": "Oggi continua la sua parata con Grillo e Goldoni. Olive colte zero, ma sfila costantemente la grazia dei suoi mezzi passando tra gli olivi. Finalmente si sta rilassando e impara ad apprezzare la compagnia della raccolta.", "title": "PRONTO PER IL CARNEVALE DI VIAREGGIO", "photo": "00003590-PHOTO-2024-11-16-18-15-14.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Gioia", "voto": "6", "text": "Oggi non l'ho vista tranne che per la foto. Sarà stata costantemente a lavoro e nascosta tra le fronde. O almeno vogliamo crederlo. Se ha mantenuto gli stessi standard sicuramente sarà così.", "title": "6 SULLA FIDUCIA", "photo": "00003591-PHOTO-2024-11-16-18-15-23.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Nicola (ospite)", "voto": "7+", "text": "Primo anno per lui, ma già denso di presenze. Ormai sembra più esperto della maggioranza dei presenti. Domani andrà in rappresentanza alla fiera dell'olio. Pronto per denigrare tutti gli altri produttori. Si unisce agli insulti e alle prese in giro verso gli assenti e i fannulloni. Omaggia tutti con dell'ottimo vino.", "title": "DA NOVELLINO A NOVELLO", "photo": "00003592-PHOTO-2024-11-16-18-15-34.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Lucia", "voto": "9", "text": "È rimasta in casa il grosso della mattinata, ma compare sul campo per qualche minuto nel pomeriggio per donarci un po' della sua saggia bellezza e cogliere qualche oliva. Una bella gnocca così non si trova spesso nei boschi di Ferrano. Siamo più che fortunati.", "title": "TOCCATA E FIGA", "photo": "00003593-PHOTO-2024-11-16-18-15-44.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Andrea", "voto": "6.5", "text": "La sufficienza era dovuta, anche solo per essere passato a salutare. La foto è nel campo di olivi invece che al box e già qui potremmo fermarci. Lui lo ha fatto per riprendere fiato un minuto, poi torna a fare uno dei suoi lavoretti. Prova a rimettere un frullino che però muore dopo poco.", "title": "VIP", "photo": "00003594-PHOTO-2024-11-16-18-15-52.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Monica", "voto": "6+", "text": "Il pomeriggio è la sua ora preferita. Una costante il suo arrivo post pranzo e ottimo il contributo nella raccolta. Monica, sappi che il cibo non manca e puoi venire anche a pranzo se vuoi!", "title": "APPUNTAMENTO FISSO", "photo": "00003595-PHOTO-2024-11-16-18-16-17.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Nicole", "voto": "6+", "text": "La sua presenza come sempre è fondamentale per la squadra. Oggi non ha avuto un grande impatto nelle olive raccolte ma porta con sé il solito umorismo anche se più spenta del solito. Fa 12 fermate, tra un olivo e l'altro, dalla tavola alla cucina, e poi saluta tutti.", "title": "ZIA CRUCIS", "photo": "00003596-PHOTO-2024-11-16-18-16-27.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Chiara", "voto": "4.5", "text": "Dispiace a tutti per il voto ma sono state poche le sue presenze quest'anno e quindi il voto rappresenta tutta la stagione anche se nel suo quarto di giornata di oggi ha lavorato. Compare per un paio di ore, scrocca il pranzo, sfrutta la presenza di Nicole per fare due scambi da intellettuali e se ne va dopo questo piccolo assaggio.", "title": "DEGUSTAZIONE DI FATICA", "photo": "00003597-PHOTO-2024-11-16-18-16-37.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Madda", "voto": "5.5", "text": "Oggi la femmina in casa Danti non ha dato lo stesso contributo delle scorse presenze. Meno essenziale nella stesura teli, ma comunque di compagnia. Passeggia tra gli olivi con chiunque e senza far nulla. Vuole bene al fratello ogni giorno di più.", "title": "IN GITA SCOLASTICA", "photo": "00003598-PHOTO-2024-11-16-18-16-47.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Lorenzo", "voto": "7+", "text": "Su di lui si raccontano tantissime storie. I menestrelli cantano le sue avventure. Peccato che di tutte queste storie lui è solitamente lo sventurato di turno. Oggi invece per fortuna non ha portato male, anzi lavora e porta a casa il risultato. Il risultato che vuole lui, perché lascia metà olive sugli alberi e così abbassa la media di Ferrano, ma conta il giusto.", "title": "PROVE INVALSI", "photo": "00003599-PHOTO-2024-11-16-18-16-57.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Raffo", "voto": "7.5", "text": "Oggi troppe pause per il ragazzo, ma nel complesso ha fatto un'ottima prestazione. Specialmente a tavola, dove divora il primo, il secondo e stava per dare un morso anche alla nonna Lucia. Durante la raccolta si diletta nel prendere olive al volo, anziché buttarle giù e spara troppe cazzate.", "title": "CAMPIONE DI BADMINCHION", "photo": "00003600-PHOTO-2024-11-16-18-17-03.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Lapo", "voto": "7.5", "text": "Prima apparizione sul campo di Ferrano. Un ottimo inizio per il classe 94. Supporta la raccolta sfruttando la sua statura al massimo. 30 anni che cresce e non smette mai. Una gemma per la nostra squadra.", "title": "LAPOSLAZZULO", "photo": "00003601-PHOTO-2024-11-16-18-17-10.jpg", "year": "2024"}, {"date": "2024-11-16", "name": "Matte", "voto": "10, lode e bacio accademico", "text": "Oggi niente da fare, senza di lui neanche le poche cassette fatte avremmo portato a casa. Amministra bene tutta la squadra e controlla che ci sia ordine e disciplina tra i nuovi arrivati. Insegna ai debuttanti l'arte del frullino e della stesura dei teli, dimostrandosi per loro una guida esperta. Carica e scarica teli e cassette per tutto il giorno senza mai stancarsi.", "title": "SHERPA", "photo": "00003602-PHOTO-2024-11-16-18-17-17.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Zio Andrea", "voto": "5", "text": "5 per la raccolta delle olive, 9 per l’artigianato. Passa la giornata a rimettere a posto l’espace. Ci riesce e con solo 11 €, mantenendo saldo il bilancio della caciatta. Meglio di così non si può.", "title": "BOB L’AGGIUSTA TUTTO", "photo": "00003672-PHOTO-2024-11-24-16-19-44.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Spartaco", "voto": "5.5", "text": "Oggi basta regalare voti. Il nostro vagabondo preferito non coglie molte olive ma si infila spesso in discussioni per perdere un po’ di tempo. Pesta un sacco di olive e passa in mezzo a tutti trascinandosi dietro tutti i teli. Un po’ sempre in mezzo ma Ti vogliamo bene capitano.", "title": "MORAIOLO", "photo": "00003673-PHOTO-2024-11-24-16-19-54.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Babbo", "voto": "6.5", "text": "Anche oggi non c’è stato verso di vederlo con il focus su qualcosa. Agitato sposta teli creando buchi enormi, porta cassette, frulla un po’ Lasciando metà olive, e ogni tanto urla “MADDAAA”!!!", "title": "L’OROLOGIO A CUCÙ PIÙ FASTIDIOSO DI SEMPRE", "photo": "00003674-PHOTO-2024-11-24-16-20-01.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Gioia", "voto": "6-", "text": "Oggi continua il suo grande contributo, ma difende troppe volte la ragazza classe 98 anche quando non se lo merita e da qui il voto basso. Troppo giusta e buona con tutti.", "title": "ANGELO CUSTODE", "photo": "00003675-PHOTO-2024-11-24-16-20-10.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Fabio", "voto": "4", "text": "Oggi non era giornata per nostro capoclasse. Quest’anno la sua resa non ha raggiunto le aspettative. Sembra ne vada fiero ma non ha capito che la sufficienza è lontana.", "title": "SCONFITTA A TAVOLINO", "photo": "00003676-PHOTO-2024-11-24-16-20-18.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Zia Checca", "voto": "8-", "text": "Oggi intavola un artista che anche un vegano avrebbe mangiato e apprezzato. Zero umiltà per lei che se ne esce con “sono bravissima a cucinare”. I sudditi le obbediscono, ma stavolta i complimenti sono meritatissimi.", "title": "ARISTACRATICA", "photo": "00003678-PHOTO-2024-11-24-16-20-36.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Nicole", "voto": "6-", "text": "Oggi presente sul campo ma non ottimo suo contributo. Passa il pranzo a cercare topolini, nonostante l’arista sul tavolo. Prova a lanciare una cassetta a distanza di 30 cm, fallisce miseramente.", "title": "LANCIO DEL PESO PIUMA", "photo": "00003679-PHOTO-2024-11-24-16-20-42.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Madda", "voto": "5 -", "text": "All’arrivi del master tutti elogiano il suo grande contributo. Tuttavia all’arrivo del master si diletta nel prenderlo in giro. Continua imperterrita a dire al padre “babbo io non ce la faccio piu”, ma viene da chiedersi “a fare cosa ? Riposarsi?”", "title": "BIGLIETTO OMAGGIO", "photo": "00003680-PHOTO-2024-11-24-16-20-53.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Matte", "voto": "11-1", "text": "Oggi arriva a mezzogiorno. Tutti pronti a giudicare e infamare il master si ricredono subito. Prende il frullino in mano e non lo molla per un secondo. Si prende un attimo per uno scatto con il micio.", "title": "MILLY E IL VAGABONDO", "photo": "00003681-PHOTO-2024-11-24-16-20-59.jpg", "year": "2024"}, {"date": "2024-11-24", "name": "Nonna", "voto": "8.5", "text": "Sia la foto che lo sguardo ricordano molto quando alla messa passano a chiedere i soldi e tu non hai un centesimo da dargli. solo che lei chiede olive e tanto sudore.", "title": "CHIERICHETTO", "photo": "00003682-PHOTO-2024-11-24-16-21-57.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Checco", "voto": "4+", "text": "Raccolta pessima la sua, oggi migliora un po’ ma nonostante l’impegno scappa dalla fatica. Resta in Lizza per cappellino della vergogna insieme ai cugini. Il Natale si avvicina e il vicefattore è pronto al riposo non meritato.", "title": "UNA POLTRONA PER UNO…STRETTO", "photo": "00003705-PHOTO-2024-12-01-16-48-16.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Rani", "voto": "3+", "text": "Quest’anno ci ha deluso. Lo abbiamo aspettato tutti, ma non si è mai fatto vedere. Frulla una decina di olive in totale. Ha fatto una cassetta ma di mele. Sarà venuto per fare la spesa ?", "title": "DIRITTO DI RECESSO", "photo": "00003706-PHOTO-2024-12-01-16-48-24.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Madda", "voto": "4+", "text": "Oggi arriva tardi, non lavora, e sta in compagnia della madre e della nonna. Speriamo che almeno gli abbiamo passato un po’ di saggezza.", "title": "INVECCHIATA PRESTO", "photo": "00003707-PHOTO-2024-12-01-16-48-35.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Nico", "voto": "7.5", "text": "Essenziale la sua presenza. Ci era mancato e infatti non prende 10 solo per la prolungata assenza. Perdonato, perché torna con un master in olivicoltura e alza il livello di tutta la squadra.", "title": "3 STELLE MICHELINI", "photo": "00003708-PHOTO-2024-12-01-16-48-42.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Mamma", "voto": "6.5", "text": "Raccolta proficua, non per l’olio, ma per quelle sotto sale. Ci aspettiamo un barattolino a testa e se è buono come lo spezzatino, siamo a posto.", "title": "GRAN SELEZIONE 66", "photo": "00003709-PHOTO-2024-12-01-16-48-53.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Nicola", "voto": "7", "text": "Oggi si sente più vivo che mai, essendo l’ultimo giorno della raccolta. Il nostro stakanovista ha lavorato molto , e ieri stava per fare anche le olive dei casodi. Non conosce ancora bene i sentieri del podere per cui lancia il goldoni giù da un dirupo.", "title": "NEOPATENTATO", "photo": "00003711-PHOTO-2024-12-01-16-49-06.jpg", "year": "2024"}, {"date": "2024-12-01", "name": "Matte", "voto": "10, lode, bacio accademico, e con la lingua", "text": "Raccolta fantastica la sua. Mai fermo, primo ad arrivare sul campo. Chiedetevi come mai in tutte le pagelle ha il voto più alto. La media parla da sola. Se quest’anno avete olio in tavola è in gran parte merito suo.", "title": "PREGO", "photo": "00003712-PHOTO-2024-12-01-16-49-12.jpg", "year": "2024"}, {"date": "2025-11-01", "name": "Madda", "voto": "6.5", "text": "Energia sempre positiva nella squadra, cerca di prendere le redini quando il fratello si riposa. Alcuni gli danno retta, altri meno, ma almeno ci prova.", "title": "LADY GASA", "photo": "00004393-PHOTO-2025-11-01-22-08-46.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Raffo", "voto": "8-", "text": "Nonostante la mano sembra appena uscita da una pentola di acido, arriva con la macchina e riesce pure a supportare la squadra nella raccolta. Supporta Più che altro per compagnia,sigarette e abbracci.", "title": "PIERO PELUCHE", "photo": "00004394-PHOTO-2025-11-01-22-08-57.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Charlotte", "voto": "5+", "text": "La mattina non si sa bene cosa abbia fatto ma nel pomeriggio il suo contributo è stato abbastanza scarso e per questo manca anche la foto. Ci aspettiamo molto di più dalla londinese per le prossime apparizioni.", "title": "#Almeno insegnaci l’inglese", "photo": null, "year": "2025"}, {"date": "2025-11-01", "name": "Silvi", "voto": "5", "text": "Ogni tanto si sente urlare “topinooo” e allora capisci che la Silvi è sveglia. Oggi ha gestito lei la telistica, ma poteva fare meglio. Un po’ assonnata e non ha portato doni.", "title": "UNA DEI TRE MOGI", "photo": "00004396-PHOTO-2025-11-01-22-09-20.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Mariarita", "voto": "7.5", "text": "Inutile dire che il suo contributo è stato essenziale. Spezzatino eccellente, olive colte, molte. Senza di lei si lavorerebbe in silenzio, chiacchiera con tutti.", "title": "RADIO MARIA(RITA)", "photo": "00004397-PHOTO-2025-11-01-22-09-30.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Chiari", "voto": "5- -", "text": "Oggi arriva per pranzo, nel primo pomeriggio si siede e chiacchiera con tutti. Olive colte ce lo dice lei. Circa 4.", "title": "PARTITA RINVIATA", "photo": "00004398-PHOTO-2025-11-01-22-09-41.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Nicola", "voto": "7+", "text": "Oggi ha lavorato sodo ma si vedeva che non era nella sua comfort zone. Siamo abituati tutti a vederlo in camicia stile banchiere ma oggi magliettina e pile.", "title": "MONTE DEI COLPI DI SCENA", "photo": "00004399-PHOTO-2025-11-01-22-09-48.jpg", "year": "2025", "person": "Nicola (ospite)"}, {"date": "2025-11-01", "name": "Monica", "voto": "7", "text": "Lavora sodo, ma non si fida di nessuno, tanto da portarsi lo zaino anche a tavola. Tranquilla moni, non te lo rubiamo.", "title": "DIFFIDENTE", "photo": "00004400-PHOTO-2025-11-01-22-09-53.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Nicola", "voto": "8-", "text": "Il capitano ha voglia di lavorare ma oggi ha male al ginocchio. Inutile dire che senza di lui il podere non va avanti, ma ha il brutto vizio di cercare efficenza ovunque. Porta comunque il risultato lavorando sodo, teli, frullino, goldoni.", "title": "MonopOLIO", "photo": "00004401-PHOTO-2025-11-01-22-09-59.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Fabio", "voto": "6.5", "text": "Non fa granché fino all’arrivo del master, che lo prende sotto la sua ala e lo porta a finire il campo sopra. Diciamo perdonato, ma solo per questa volta.", "title": "INDULGENZA PRECARIA", "photo": "00004402-PHOTO-2025-11-01-22-10-05.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Checca", "voto": "6+", "text": "Odiando i frullini, Praticamente il suo compito è stato quello di cogliere tutte le olive basse. Via via riempie cassette usando la maglia come container.", "title": "A PORTATA DI NANO", "photo": "00004403-PHOTO-2025-11-01-22-10-11.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Checco", "voto": "5-", "text": "La mattina ha praticamente mandato solo il trattore. Il pomeriggio aspetta l’arrivo del fratello per potersi sedere e guardare gli altri. A fine giornata simula un dolore alla spalla per poter saltare la domenica. Troppe soste bagno.", "title": "VENI VIDI WC", "photo": "00004404-PHOTO-2025-11-01-22-10-16.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Ale", "voto": "10", "text": "Fenomenale il suo contributo. Sul campo sembra un 18enne in vacanza. Cappellino, tuta e frullino. Chiede consigli e segue le direttive. Fa un po’ il leccaculo ma è apprezzato.", "title": "IN GITA", "photo": "00004405-PHOTO-2025-11-01-22-10-21.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Stefania", "voto": "5", "text": "Telista di grande fama e capacità ma al contrario del marito oggi fa troppa polemica con il pagellista e si mette i bastoni tra le ruote da sola. Ci vorrà un po’ tempo per capire come funziona il gioco.", "title": "AUTODISTRUTTIVA", "photo": "00004406-PHOTO-2025-11-01-22-10-27.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Dennis", "voto": "5-", "text": "Oggi si è presentato. Quindi partiamo dalla sufficenza. Ma l’approccio con il quale aggredisce gli olivi è lo stesso di un donnaiolo a ballare. Lascia metà delle olive sopra, e l’altra metà la pesta.", "title": "UNA BOTTA E VIA", "photo": "00004407-PHOTO-2025-11-01-22-10-34.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Lucia", "voto": "9-", "text": "Impeccabile il ragù, dimostra anche questa volta di essere lei la padrona di casa. Ogni tanto concima l’aria con qualche venticello.", "title": "CUREGGINA REGGENTE", "photo": "00004408-PHOTO-2025-11-01-22-10-38.jpg", "year": "2025"}, {"date": "2025-11-01", "name": "Matte", "voto": "10-+", "text": "Oggi riposa leggermente solo per dare il meglio il pomeriggio e dare il cambio a tutti che non ne potevano più. Dopo pranzo, l’unico a lavorare. Ed è solo grazie a lui che oggi si porta a casa l’olio. Il campione è pronto, La cena è servita.", "title": "JANNIK DINNER", "photo": "00004409-PHOTO-2025-11-01-22-10-48.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Andrea", "voto": "6 politico", "text": "Il nonno oggi è in agitazione , sente la pressione del palco , nemmeno fosse San siro. Gli 80 anni pesano sulle spalle , ma visto che è il suo compleanno il 6 è meritato.", "title": "PERDONATO", "photo": "00004460-PHOTO-2025-11-08-16-39-38.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Lia", "voto": "3.5", "text": "Oggi assente. Si presenta per la foto ma non si presenta a nessuno.", "title": "PARTITA RINVIATA", "photo": "00004461-PHOTO-2025-11-08-16-39-43.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Tommi", "voto": "5", "text": "Arriva alle 15.30, alle 15.55 smette e si mette a chiacchiera con la Madda. Si propone però di presenziare anche la domenica per rimediare alla prestazione.", "title": "TRANQUILLI , DOMANI TORNO", "photo": "00004462-PHOTO-2025-11-08-16-39-49.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Cha", "voto": "7+", "text": "Oggi il suo compito era chiaro. Fare la zia e occuparsi del riposino di Ada. A vedere dalla foto, è chiaro il risultato raggiunto.", "title": "ANESTETICO", "photo": "00004463-PHOTO-2025-11-08-16-39-56.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Lucy", "voto": "6.5", "text": "La Y è per differenziarla dalla padrona di casa, visto che entrambe si dilettano con uncinetto, maglia, punto croce, croce punto e punti e virgola. Si diletta a lanciare le olive fuori dai teli. Apprezzata per la simpatia.", "title": "POLTRONE E SOFÀ, BEATO CHI CE LA FA", "photo": "00004464-PHOTO-2025-11-08-16-40-02.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Lucia", "voto": "10", "text": "La regina del matriarcato. Responsabile di rendere magico un posto come ferrano. Seleziona tutti i rami di olivi e sceglie quale tenere. Ma ricorda: è la bacchetta a scegliere te, non te la bacchetta.", "title": "OLIVAnder", "photo": "00004465-PHOTO-2025-11-08-16-40-08.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Marj", "voto": "4+", "text": "Con il timore di perdere i diritti sulle feste a Masino in vista di capodanno , si presenta e fa una scelta saggia. Non si sa se davvero ha provato il frullino, ma comunque vogliamo crederle. Lo stile è quello che è, molto simile a quello della nonna Lucia.", "title": "GIORNO DI PROVA", "photo": "00004466-PHOTO-2025-11-08-16-40-14.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Baio", "voto": "4", "text": "Oggi dobbiamo dire che ha avuto un’idea geniale. È arrivato alle 13 vestito da scout anche se non li aveva. Nessuno avrebbe potuto dirgli nulla. Convinto anche dell’esecuzione arriva con le mani in tasca come se nulla fosse e con zero preoccupazioni.", "title": "GENIO DEL BENESSERE", "photo": "00004467-PHOTO-2025-11-08-16-40-19.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Checca", "voto": "10", "text": "Oggi ha superato se stessa. È riuscita con Photoshop a mettere un frullino in mano alla marj. Contenta del risultato, mostra a tutti il suo operato.", "title": "TRUCCO DI MAGIA", "photo": "00004468-PHOTO-2025-11-08-16-40-24.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Checco", "voto": "5.5", "text": "Ha chiesto il turno a lavoro per non frullare la mattina. Arriva per mangiare. Il pomeriggio prende in mano il frullino e subito simula palesemente un infortunio per chiedere il cambio. Nessuno glielo dà. Costretto a lavorare.", "title": "AMMONITO", "photo": "00004469-PHOTO-2025-11-08-16-40-30.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Mari", "voto": "7", "text": "Oggi grande contributo. Con Cacioli hanno buttato giù 300 olivi. Non ha un ruolo fisso ma spazia sulle base delle necessità. Non solo in campo ma anche in cucina.", "title": "TUTTOFARE", "photo": "00004470-PHOTO-2025-11-08-16-40-35.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Nicola", "voto": "6+", "text": "Gli è stato detto più volte di scaricare le olive..le ha messe nel 730. Oggi per sfamare tutti ha fatto la spesa alla metro, fatturina e via, lo ha passato come team building.", "title": "ABBUFFINO", "photo": "00004471-PHOTO-2025-11-08-16-40-40.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Nicole", "voto": "8", "text": "Riesce a sfuggire dalla preparazione del party per unirsi alla festa vera. Zia Crucis è pronta a dare spettacolo. Super.", "title": "L’ANIMA DELLA FESTA", "photo": "00004472-PHOTO-2025-11-08-16-40-44.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Ada", "voto": "10", "text": "Carica e coccolosa. Come i pinguini di madagascar. Coglie anche dei fiori per il festeggiato e porta così a casa il voto eccellente.", "title": "KOWALSKI", "photo": "00004473-PHOTO-2025-11-08-16-40-48.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Leo", "voto": "4", "text": "Oggi il suo contributo è stato quello di portare Ada. Non coglie neanche un’oliva e sfugge costantemente da frullini o attività faticose. Coglie però dei topinambur.. ne va fiero.", "title": "IN LETARGO", "photo": "00004474-PHOTO-2025-11-08-16-40-53.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Madda", "voto": "4-", "text": "Mai vista in tutti questi anni una stagione cosi scarsa. Giudica ogni cosa, Teli messi male, 800 heets e prende in giro tutti.", "title": "BULLA", "photo": "00004475-PHOTO-2025-11-08-16-41-00.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Checco", "voto": "4+", "text": "Oggi ha fatto meno di zero. Grappini e riposini. A un certo punto si inventa ingegnere per “rimettere il grillo”. Risultato? Grillo ancora ai box e checco pure.", "title": "RETROCESSO", "photo": "00004476-PHOTO-2025-11-08-16-41-04.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Silvi", "voto": "6+", "text": "Arriva in ritardo perché doveva sopprimere il gatto. Alla fine non ci è riuscita e l’ha riportato a casa. Oggi tante chiacchiere per la piccola in casa madrigali e poco lavoro.", "title": "IN RISERVA", "photo": "00004477-PHOTO-2025-11-08-16-41-09.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Ale", "voto": "9.5", "text": "Dove non arriva in altezza, compensa con il frullino. Forse non gli piace e non vorrebbe venire, ma ormai è partita la gara in casa Madrigali e tutto sommato dalle 14 alle 16 si può fare. Interpreta bene il ruolo ma in modo molto tranquillo e sereno.", "title": "AL PACATO", "photo": "00004478-PHOTO-2025-11-08-16-41-14.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Stefi", "voto": "10-", "text": "Oggi si presenta a ferrano subito dopo pranzo, e senza esitare saluta per primo il master. Ha compreso le regole del gioco e il gioco fa la sua fortuna.", "title": "INTEGRITÀ MORALE", "photo": "00004479-PHOTO-2025-11-08-16-41-19.jpg", "year": "2025"}, {"date": "2025-11-08", "name": "Fabio", "voto": "6", "text": "Arriva con la schiacciata ma la dimentica in casa e fa solo venire l’acquolina ai colleghi sudati nel campo. Unico pregio, la competizione con il danti senior che provoca continuamente.", "title": "SPARRING PARTNER", "photo": "00004480-PHOTO-2025-11-08-16-41-23.jpg", "year": "2025", "person": "Cacio"}, {"date": "2025-11-08", "name": "Matte", "voto": "10 e lode", "text": "Godetevi questo istante, l’unico in cui si è riposato e non ha scelto un posto a caso. Ha scelto un posto da cui poteva comunque cogliere le olive. Indiscussa la sua influenza sulla performance complessiva. Pagelle come sempre senza favoritismi.", "title": "ECCELLENZA GESTIONALE", "photo": "00004481-PHOTO-2025-11-08-16-41-31.jpg", "year": "2025"}, {"date": "2026-10-25", "year": "2026", "name": "Monica", "voto": "6+", "text": "Mezza giornata su due, e pure quella solo di mattina. Coglie le olive tutte a mano, una a una, con lo zaino in spalla che non toglie neanche questa volta. Cosa ci sia dentro ancora non si sa. Probabilmente la merenda, visto che ci abbandona prima di pranzo. La aspettiamo alle prossime raccolte.", "title": "PRANZO AL SACCO", "photo": "monica-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Checco", "voto": "5.5", "text": "Presente 2 giornate su 2, ma solo di numero. Cosa serve per non fare niente durante la raccolta? Basta lamentarsi della spalla da mesi e prenotare pure l'ortopedico, così nessuno può contestare. Frulla qualcosa, ma più che altro traccheggia. In foto ha i cavi in mano: non si capisce se stia collegando il frullino o cercando come staccarlo. Poco sotto la sufficienza.", "title": "ME LO HA DETTO L’ORTOPEDICO", "photo": "checco-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Alessandro", "voto": "8", "text": "Partecipa solo a una giornata su due, ma il suo contributo vale doppio. Per la simpatia e soprattutto per gli allenamenti che da mesi, alle 6 del mattino, porta avanti con bilanciere e manubri da 10 kg in preparazione del suo amato frullino. In foto si riposa tra una serie e l'altra. Il ragazzo che non invecchia.", "title": "PETER PAN", "photo": "alessandro-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Stefania", "voto": "7", "text": "Una giornata su due, come il marito. Va dal master a dichiarare che si meriterebbe un 4, poi a fine giornata cambia strategia e fa un po' la leccaculo. Ma la mossa vincente l'aveva già giocata nei giorni prima: le nastrine regalate al professore. Il 7 è servito. In foto mostra fiera una manciata di olive: la raccolta di tutto il weekend.", "title": "WENDY", "photo": "stefania-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Tommi", "voto": "9", "text": "Nuovo acquisto della brigata. Si presenta la domenica, ma senza la compagna. Bonaccione, scherza con tutti e si unisce alle prese in giro verso Checco. Fa lo stronzo, ma con garbo, così nessuno se ne accorge. In foto frulla lui, Checco sullo sfondo guarda: la prova regina.", "title": "WINNIE THE PUTA", "photo": "tommi-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Nicola", "voto": "7+", "text": "Tre presenze su due: lo zar di Ferrano apre la campagna già il venerdì, e nessuno sa quando la chiuderà. Mecenate della raccolta, finanzia di tasca sua carrello nuovo e ventola per il defogliatore. Ma ogni rublo speso va ripagato in olive: chi si siede viene scovato e rispedito al frullino. Generoso con il portafoglio, spietato con i fannulloni.", "title": "IBAN IL TERRIBILE", "photo": "nicola-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Madda", "voto": "5-", "text": "Nuovo taglio, stesso impegno. Il suo compito è stendere i teli, e lo fa come chi apparecchia per un matrimonio: tovaglia verde e coperti per trenta olivi. Poi passa alla degustazione, soprattutto delle pause. In foto la sua cassetta è piena, ma di felpe. Annata da dimenticare, taglio da ricordare.", "title": "TENUTA FRANGIACORTA", "photo": "madda-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Raffo", "voto": "4+", "text": "Durante la giornata affianca il master nella costruzione di un defogliatore professionale. Grande sorpresa: dopo anni da elettricista, propone di collegare un 12 volt direttamente al 220. Olive colte poche, ma sarebbero state ancora meno se avessimo attaccato la spina. In foto i capelli confermano il collaudo.", "title": "MEA CULPA", "photo": "raffo-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Zio Andrea", "voto": "4", "text": "Non pervenuto, o meglio: solo a pranzo. Colpa degli 80 anni, dice. Strano però che a golf le 18 buche non pesino mai. In foto si scalda per lo swing: divano, telefono e telecomando a portata di mano.", "title": "SETTORE OSPITI", "photo": "andrea-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Fabio", "voto": "6- -", "text": "Quest'anno il suo amato frullino arancione non è tornato in vita, e come se non bastasse ci ha lasciato anche l'Espace. Annega il dolore in un supporto quasi inutile, armato del solo rastrellino. Salta pure il pranzo conviviale. In foto ritrova il sorriso solo in sella al Grillo: almeno un motore che parte. Atteso il rientro in campo a pieno regime dalla prossima settimana.", "title": "CI MANCHI", "photo": "fabio-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Dennis", "voto": "5", "text": "Intanto è arrivato, e questo è già qualcosa. La voglia di lavorare è quella di chi ha fatto serata e ha bevuto come un cammello. Fisico da atleta e vestiario da fashion week di Milano. Almeno supporta la raccolta prendendo in mano il frullino per un paio di minuti. Aspettiamo con ansia le sue performance nelle prossime giornate.", "title": "SBRONZO DI RIACE", "photo": "dennis-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Nonna Lucia", "voto": "9.5", "text": "Cucina perfetta: polenta con spezzatino degna di Cracco. Sempre presente e sorridente. Supporta anche la raccolta rastrellando qua e là, forse perché con il gilet nuovo ha finalmente le braccia libere.", "title": "SMANICATA", "photo": "lucia-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Nicole", "voto": "6+", "text": "Si presenta in mattinata annunciando che andrà via presto, ma poi rimane. A pranzo, nella sua nuova veste di vegetariana, si porta la robiola da casa. La sua vera performance però la aspettiamo dopo la lettura delle pagelle. Intanto delizia tutti con le sue perle di saggezza.", "title": "ROBIOLA DA MATTI", "photo": "nicole-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Mariarita", "voto": "7", "text": "Supporta la raccolta soprattutto con chiacchiere, selfie e compagnia. Ogni tanto salva Checco dal \"mal di spalla\" prendendogli il frullino. Il motore è acceso, ma si sente solo lei.", "title": "RADIOLINA", "photo": "mariarita-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Silvi", "voto": "6+", "text": "L'unica sufficienza di via Jacopo da Diacceto 22. Dà il massimo sia sul campo che a tavola, ma a tavola rende meglio. Sul campo passa più tempo a cercare compagne di chiacchiere che olive da cogliere. In foto lo sguardo di chi ha appena sentito il voto del compagno.", "title": "MEDIA PONDERATA", "photo": "silvi-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Cacio", "voto": "6.5", "text": "Va via presto, come sempre. Ma si sa: ora è una persona importante, e non può passare troppo tempo con dei contadini come noi. Sarà corso a casa a scrivere un post su LinkedIn sulla sua straordinaria esperienza nella raccolta delle olive, facendo concorrenza alla figlia che lavora a Il Punto. Almeno una cosa in comune con il master ce l'ha: di impianti elettrici non ci capisce un cazzo. Arriva, se ne va, ma non è mai una chiusura definitiva: lo aspettiamo sempre, e prima o poi ritorna. In foto, la sua tenuta da raccolta.", "title": "PUNTO E VIRGOLA", "photo": "cacio-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Chiari", "voto": "8.5", "text": "La presenza annuale l'ha già timbrata al primo appuntamento, anche se solo per mezza giornata. Poi torna al suo nuovo ruolo di professoressa. Per certi versi la sua partenza ci ha salvati tutti da note e bacchettate. Supporta la raccolta in modo lodevole e fa le veci del master quando lui non è in campo.", "title": "SUPPLENZA BREVE", "photo": "chiari-2026-10-25.jpg"}, {"date": "2026-10-25", "year": "2026", "name": "Matte", "voto": "10+3+3", "text": "C'è poco da fare, ragazzi: è come vedere Mbappé giocare nel Cagliari, siamo su un altro livello. In questi due giorni inaugura il nuovo reparto di defogliatura e coglie più olive di tutti, garantendo anche quest'anno il pane con l'olio a un'intera famiglia. In foto presenta il nuovo reparto come un concessionario all'inaugurazione. Come sempre pagelle senza favoritismi né meritocrazia.", "title": "LUDOPRATICO", "photo": "matte-2026-10-25.jpg"}], "notes": {"2025-11-02": "Giornata senza schede: \"Oggi confermo il 6 politico a tutti. Tranne la Madda che non ha lavorato benissimo. 6-\"", "2026-10-25": "Pagellino unico per sabato 24 e domenica 25 ottobre."}, "labels": {"2026-10-25": "24–25 ottobre 2026"}, "aliases": {"Ale": "Alessandro", "Babbo": "Nicola", "Cha": "Charlotte", "Chiara": "Chiari", "Francesco": "Checco", "Leo": "Leonard", "Lucia": "Nonna Lucia", "Nonna": "Nonna Lucia", "Maddalena": "Madda", "Mamma": "Mariarita", "Mari": "Mariarita", "Maria Rita": "Mariarita", "Marj": "Marjana", "Matteo D.": "Matte", "Nico": "Miche", "Rani": "Ranieri", "Silvia": "Silvi", "Stefi": "Stefania", "Virgi": "Virginia", "Zia Checca": "Checca", "Zia Nicole": "Nicole", "Zio Andrea": "Andrea", "Francesca": "Checca"}, "alias_rules": [{"name": "Matteo", "year": "2021", "to": "Matte"}, {"name": "Matteo", "to": "Matteo C."}], "no_presence": ["Sylvie E Didier"]};
