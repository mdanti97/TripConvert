<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Pagellino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat+Brush&display=swap">
<style>
img{max-width:100%}[hidden]{display:none!important}body{margin:0}
/* Layout: un registro di classe su carta a quadretti; per ogni stagione le giornate di raccolta, per ogni giornata le schede-pagella con voto a penna rossa e soprannome a timbro */
:root{
  --bg:#f3f5ec;          /* carta del quaderno, appena verde oliva */
  --grid:#dfe5cf;        /* quadretti */
  --paper:#fbfcf7;       /* scheda */
  --ink:#232a17;         /* inchiostro scuro oliva */
  --muted:#5f6a4a;
  --olive:#56662a;       /* verde oliva */
  --olive-soft:#e6ebd3;
  --pen:#c62d23;         /* penna rossa del professore */
  --v-ok:#2e7a35;        /* voto alto */
  --v-mid:#a87300;       /* voto tra 6 e 8 */
  --line:#cfd6bb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-pen:"Caveat Brush","Comic Sans MS","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a10;--grid:#20261a;--paper:#1e2416;--ink:#e9edd9;--muted:#a7b28c;--olive:#b5c77a;--olive-soft:#2b331f;--pen:#ff6b5e;--line:#353f27;--v-ok:#7fcf84;--v-mid:#f0c04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a10;--grid:#20261a;--paper:#1e2416;--ink:#e9edd9;--muted:#a7b28c;--olive:#b5c77a;--olive-soft:#2b331f;--pen:#ff6b5e;--line:#353f27;--v-ok:#7fcf84;--v-mid:#f0c04a;color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{padding-block:44px 22px}
.eyebrow{font-family:var(--f-display);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--olive)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,8vw,5.2rem);line-height:.95;margin:.25em 0 .15em;letter-spacing:-.02em;text-wrap:balance}
h1 .bang{color:var(--pen)}
.motto{font-family:var(--f-pen);font-size:clamp(1.3rem,3.4vw,1.75rem);color:var(--pen);transform:rotate(-1.5deg);display:inline-block;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-family:var(--f-display);color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:800}

nav.bar-old{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-block:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.years{display:flex;flex-wrap:wrap;gap:6px}
.years button{font-family:var(--f-display);font-weight:800;font-size:1rem;border:1.5px solid var(--olive);background:transparent;color:var(--olive);padding:6px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.years button[aria-pressed="true"]{background:var(--olive);color:var(--paper)}
.years button:focus-visible,.search input:focus-visible,.card button:focus-visible,.close:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.search{margin-left:auto;flex:1 1 220px;max-width:340px}
.search input{width:100%;font:inherit;font-size:.95rem;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}


.season-head{scroll-margin-top:80px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.season-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,3rem);margin:0;letter-spacing:-.01em}
.season-head span{color:var(--muted);font-family:var(--f-display)}
.day{margin-top:34px}
.day h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:1rem;color:var(--olive);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.day h3::after{content:"";flex:1;height:1px;background:var(--line)}
.day h3 small{font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:none}
.note{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-style:italic;max-width:65ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;position:relative}
.card .ph{display:block;width:100%;padding:0;border:0;background:var(--olive-soft);cursor:zoom-in;aspect-ratio:4/5;overflow:hidden;border-radius:6px 6px 0 0}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .noph{aspect-ratio:4/5;display:grid;place-items:center;background:var(--olive-soft);border-radius:6px 6px 0 0;color:var(--olive);font-family:var(--f-display);font-weight:800;font-size:3.4rem}
.card.textonly .noph{aspect-ratio:auto;height:64px;font-size:1.6rem;place-items:center start;padding-left:16px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.who{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.who h4{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;line-height:1.15;text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.voto{font-family:var(--f-pen);color:var(--pen);font-size:1.75rem;line-height:1;border:2px solid var(--pen);border-radius:50%;min-width:58px;padding:8px 8px 6px;text-align:center;transform:rotate(-6deg);flex:none;max-width:52%;overflow-wrap:anywhere}
.voto.long{font-size:1.05rem;border-radius:12px}
.text{margin:0;font-size:.95rem;flex:1}
.stamp{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);border:2px solid var(--olive);padding:4px 9px;border-radius:3px;transform:rotate(-1deg);overflow-wrap:anywhere;max-width:100%}
.card.prof{border-color:var(--pen)}
.card.prof .stamp{color:var(--pen);border-color:var(--pen)}
.empty{color:var(--muted);font-style:italic;padding:30px 0}
mark{background:color-mix(in srgb,var(--pen) 22%,transparent);color:inherit}

dialog{border:0;padding:0;background:transparent;max-width:min(92vw,720px);max-height:92vh}
dialog::backdrop{background:rgba(10,12,6,.82)}
dialog img{max-height:84vh;width:auto;border-radius:6px;display:block;margin:auto}
dialog p{color:#f3f5ec;font-family:var(--f-display);text-align:center;margin:10px 0 0}
.close{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.4rem;width:40px;height:40px;border-radius:50%;cursor:pointer}
footer{color:var(--muted);font-size:.85rem;padding-block:0 40px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}




/* Partecipanti */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-width:0}
.person:hover{border-color:var(--olive)}
.person:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.person .av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--olive-soft) center/cover no-repeat;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--olive)}
.person .pn{font-family:var(--f-display);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.person .pc{color:var(--muted);font-size:.8rem;display:block;font-weight:400;font-family:var(--f-body)}
.back{font:inherit;font-family:var(--f-display);font-weight:800;background:transparent;border:1.5px solid var(--olive);color:var(--olive);border-radius:999px;padding:6px 14px;cursor:pointer;margin-bottom:12px}
.who h4 button.pl{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.who h4 button.pl:hover{text-decoration-color:var(--olive)}
.who h4 button.pl:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tag{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}

/* Statistiche */
.season-head .badge{color:var(--paper)}
.voto.v-ok{color:var(--v-ok);border-color:var(--v-ok)}
.voto.v-mid{color:var(--v-mid);border-color:var(--v-mid)}
.voto.v-ko{color:var(--pen);border-color:var(--pen)}
table.pres td.v-ok{color:var(--v-ok);font-weight:700}
table.pres td.v-mid{color:var(--v-mid);font-weight:700}
table.pres td.v-ko{color:var(--pen);font-weight:700}

.statbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--olive)}
button.sort{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
button.sort:hover{color:var(--olive)}
button.sort:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

.tablist button.stat{border-style:dashed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0 22px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.tile b.pen{color:var(--pen)}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px}
table.pres{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
table.pres th,table.pres td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.pres th{font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--paper)}
table.pres td.n,table.pres th.n{text-align:left;font-family:var(--f-display);font-weight:800}
table.pres td.z{color:var(--line)}
table.pres td.tot{text-align:left;min-width:150px}
.bar{display:inline-block;height:10px;background:var(--olive);border-radius:2px;vertical-align:middle;margin-right:8px}
table.pres tr.prof .bar{background:var(--pen)}
.statnote{color:var(--muted);font-size:.85rem;margin-top:10px;max-width:70ch}

/* Barra tab */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-block:1px solid var(--line)}
.tabs .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.tablist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding-block:2px}
.tablist::-webkit-scrollbar{display:none}
.tablist button{flex:none;font-family:var(--f-display);font-weight:800;font-size:.95rem;border:1.5px solid var(--olive);background:transparent;color:var(--olive);padding:6px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.tablist button.new{border-color:var(--pen);color:var(--pen)}
.tablist button[aria-selected="true"]{background:var(--olive);color:var(--paper)}
.tablist button.new[aria-selected="true"]{background:var(--pen);color:var(--paper)}
.tablist button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.tabs .search{flex:1 1 220px;max-width:320px;margin-left:0}
main{padding-block:22px 60px}
.badge{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:var(--pen);color:var(--paper);padding:5px 10px;border-radius:999px}
.daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;margin-top:10px}
.daychips::-webkit-scrollbar{display:none}
.daychips a{flex:none;font-size:.85rem;color:var(--olive);text-decoration:none;border:1px solid var(--line);background:var(--paper);padding:5px 10px;border-radius:999px;white-space:nowrap}
.daychips a:hover{border-color:var(--olive)}
.day,.season-head{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (max-width:600px){.tabs .search{max-width:none}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="eyebrow">Raccolta delle olive · Ferrano</div>
  <h1>Il Pagellino<span class="bang">!</span></h1>
  <p class="motto">Senza favoritismi né meritocrazia</p>
  <div class="facts" id="facts"></div>
</div></header>

<nav class="tabs" aria-label="Sezioni"><div class="wrap">
  <div class="tablist" id="tabs" role="tablist"></div>
  <label class="search"><span hidden>Cerca</span><input id="q" type="search" placeholder="Cerca un nome, un soprannome…" autocomplete="off"></label>
</div></nav>

<main><div class="wrap" id="out"></div></main>
<footer><div class="wrap">Pagelle del professore Matte, dal 2021. Foto dalla chat di famiglia.</div></footer>

<dialog id="lb"><button class="close" id="lbx" aria-label="Chiudi">×</button><img id="lbimg" alt=""><p id="lbcap"></p></dialog>

<script>
const DATA = {"entries": [{"date": "2021-11-06", "name": "Nicola", "voto": "8", "text": "Ha furia di lavorare e amministra autorevolmente ma non tocca neanche un oliva. Apparecchia i campi fino a Ristonchi.", "title": "MAGGIORDOMO", "photo": "00001202-PHOTO-2021-11-06-16-57-04.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Francesco", "voto": "5.5", "text": "Prende il frullino solo per la foto. olive colte meno di quelle pestate. Poteva almeno portare l’acqua.", "title": "PRIMOGENITO", "photo": "00001203-PHOTO-2021-11-06-16-59-21.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Nicole", "voto": "7-", "text": "Passeggia tra gli olivi e sceglie con cura quale oliva merita di essere colta.", "title": "SOMELIER", "photo": "00001204-PHOTO-2021-11-06-17-00-22.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Lucia", "voto": "9", "text": "Stanca di guardare le olive dal basso si arrampica sugli olivi, sulle scale e sui nipoti per cogliere una sola oliva. Degusta tutti con l’arista e viene perdonata.", "title": "ALPINISTA", "photo": "00001205-PHOTO-2021-11-06-17-01-03.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Andrea", "voto": "6+", "text": "Si presenta in orario per il pranzo e per questo merita il 6 POLITIco. ma è il suo compleanno e decide di non fare nulla.", "title": "COLPEVOLE", "photo": "00001206-PHOTO-2021-11-06-17-01-55.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Fabio", "voto": "10", "text": "Stanotte dormirà con il frullino accanto. Non lo molla mai. Si fa valere e porta avanti il lavoro.", "title": "CAPOCLASSE", "photo": "00001207-PHOTO-2021-11-06-17-02-58.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Ranieri", "voto": "7+", "text": "Arriva già mangiato ma mangia comunque. Per aiutare l’amico fannullone si da da fare e da il suo contributo ma viene comunque coinvolto in troppe chiacchiere. Parla con tutti.", "title": "VOLONTARIO", "photo": "00001208-PHOTO-2021-11-06-17-04-21.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Francesca", "voto": "7,5", "text": "Passeggia, riflette, chiacchiera, poi si leva dalla tasca un quintale di olive.", "title": "MARY POPPINS", "photo": "00001209-PHOTO-2021-11-06-17-04-47.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Maria Rita", "voto": "7", "text": "Un buon contributo nella raccolta delle olive, fondamentale nella stesura dei teli, la perfezione nella sfogliatura delle cassette.", "title": "DECESPUGLIATORE", "photo": "00001210-PHOTO-2021-11-06-17-05-21.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Maddalena", "voto": "7", "text": "La Foto è dell’anno scorso , ciò dimostra l’impegnò nella raccolta. Ma si sa, lei coglie un’oliva e l’olio di ferrano diventa oro liquido.", "title": "RE MIDA", "photo": "00001211-PHOTO-2021-11-06-17-07-01.jpg", "year": "2021"}, {"date": "2021-11-06", "name": "Matteo", "voto": "10", "text": "Poteva fare l’ingegnere o il comico, ha fatto entrambi. Arriva in ritardo ma senza di lui niente olio quest’anno. Perdonato e ringraziato. Pagelle senza favoritismi.", "title": "GIORNALISTA", "photo": "00001212-PHOTO-2021-11-06-17-07-57.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Ranieri", "voto": "5,5", "text": "Con la scusa del pranzo se ne va e si lava le mani.", "title": "PONZIO PELATO", "photo": "00001226-PHOTO-2021-11-07-16-23-10.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Francesca", "voto": "6,5", "text": "Buon contributo nella raccolta, tasche sempre piene, ma Complice di troppe chiacchiere sui massimi sistemi.", "title": "FILOSOFA", "photo": "00001227-PHOTO-2021-11-07-16-24-11.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Leonard", "voto": "7-", "text": "Nonostante sia diventato troppo secco e fatichi a tenere su il frullino si impegna e da un buon contributo alla causa. Colpevole di sdraiarsi sempre sui teli.", "title": "ALADINO", "photo": "00001228-PHOTO-2021-11-07-16-25-10.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Maria Rita", "voto": "6,5", "text": "Arriva con la sua scatolina da riempire con le olive da fare sotto sale. La riempie e finisce qui il suo contributo mattiniero. Nella ripresa aiuta timidamente i compagni raccogliendo una decina di olive.", "title": "LIBERA PROFESSIONISTA", "photo": "00001229-PHOTO-2021-11-07-16-26-06.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Francesco", "voto": "7- -", "text": "Inizia particolarmente polemico. Forse per rimediare l’insufficienza di ieri. Sembra sapere cosa fa, ma ne siamo sicuri ??", "title": "DI MAIO", "photo": "00001230-PHOTO-2021-11-07-16-26-48.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Nicole", "voto": "7+", "text": "Le interessa di più il voto che la raccolta in se. Fa la spia sui compagni che non lavorano. Un po’ leccaculo ma ottiene un buon risultato.", "title": "GIUDA", "photo": "00001231-PHOTO-2021-11-07-16-27-31.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Lia", "voto": "6+", "text": "Arriva per magiare la schiacciata poco prima di pranzo. Più costante nella raccolta il pomeriggio. Le piacerebbe gossippare un po’ ma è troppo stanca.", "title": "PISOLO", "photo": "00001232-PHOTO-2021-11-07-16-28-03.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Nicola", "voto": "6-", "text": "Oggi scelte dubbie sull’amministrazione dei teli, ci pensa il primogenito. Un po’ svogliato. Sarebbe restato a tavola volentieri.", "title": "POSTO FISSO", "photo": "00001233-PHOTO-2021-11-07-16-28-49.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Andrea", "voto": "5.5", "text": "Oggi non è più il suo compleanno e non viene perdonato. Sceglie di presentarsi alla fine dei lavori a guardare la squadra che fatica al posto suo.", "title": "AMMINISTRATORE DILEGUATO", "photo": "00001235-PHOTO-2021-11-07-16-30-44.jpg", "year": "2021"}, {"date": "2021-11-07", "name": "Chiara", "voto": "8", "text": "Con il pettine in mano ha fatto la frangia a tutti gli olivi. Costretta a venire dal professore, fa quello che deve e non si lamenta.", " ": "VAMPIRO", "photo": null, "year": "2022"}, {"date": "2022-10-30", "name": "Lucia", "voto": "9.5", "text": "Poco da dire, questa è casa sua e si fa sempre valere. Ogni mossa ha valore aggiunto. Nonostante sia in mezzo a tutti uomini che non capiscono un cazzo conquista il trono con la sua cucina.", "title": "ENOTECA MINCHIORRI", "photo": null, "year": "2022"}, {"date": "2022-10-30", "name": "Maddalena", "voto": "5.5", "text": "Si presenta per il pranzo, mangia e scompare, contributo per le olive pari a quello dei cugini (assenti).", "title": "NON PERVENUTA", "photo": null, "year": "2022"}, {"date": "2022-10-30", "name": "Edo", "voto": "7.5", "text": "Arriva per apprezzare il tramonto da quel di ferrano. Olive colte non molte ma di qualità e fa parlare di se. Un buon debutto.", "title": "NEO PROMOSSO", "photo": null, "year": "2022"}, {"date": "2022-10-30", "name": "Miche", "voto": "9-", "text": "Prima volta sul campo e fa scintille con il frullino. Rispetto al compagno neo arrivato però era passato il giorno prima per “dare un’occhiata”. Chissà che ha combinato.", "title": "BETA TESTER", "photo": null, "year": "2022"}, {"date": "2022-10-30", "name": "Matte", "voto": "10", "text": "Nemmeno a farlo apposta, anche quest’anno il capitano dimostra il suo valore. Teli, frullino, caffè, carica, scarica. Senza di lui anche quest’anno solo pane abbrustolito. Pagelle, come sempre, senza favoritismi.", "title": "LEADER INDISCUSSO", "photo": null, "year": "2022"}, {"date": "2022-11-01", "name": "Lia", "voto": "6", "text": "Oggi non era preparata alla fatica ma fa comunque del suo meglio per portare a casa il risultato. Chiacchiere su film e vestiti confondono i lavoratori.", "title": "AMAZON PRIMark", "photo": null, "year": "2022"}, {"date": "2022-11-01", "name": "Zia Nicole", "voto": "6.5", "text": "Poco costante nella raccolta ma ritrova un anello ormai perduto anni fa e fa di tutto per riportarlo al suo posto.", "title": "FRODO BAGGINS", "photo": null, "year": "2022"}, {"da
